<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Ask search engines not to list this page. -->
<meta name="robots" content="noindex, nofollow">
<title>Prototype test</title>
<style>
  :root {
    --bg: #F4F4F4;
    --card: #FFFFFF;
    --text: #2D2B2B;
    --muted: #666666;
    --accent: #107433;
    --border: #E5E5E5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  .intro { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  a.version {
    display: block;
    padding: 20px 24px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--accent);
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
  }
  a.version:hover, a.version:focus-visible { border-color: var(--accent); }
  a.version:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { color: var(--muted); font-size: 14px; margin: 24px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Prototype test</h1>
  <p class="intro">Open the version you've been asked to look at. This is a prototype with made-up information, so nothing you do here is saved.</p>
  <ul>
    <li><a class="version" href="version-a/">Version A</a></li>
    <li><a class="version" href="version-b/">Version B</a></li>
  </ul>
  <p class="note">Use your browser's back button to return to this page.</p>
</main>
</body>
</html>
